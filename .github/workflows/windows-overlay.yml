name: Windows overlay spike

on:
  push:
    paths:
      - "windows/spike/**"
      - ".github/workflows/windows-overlay.yml"
  pull_request:
    paths:
      - "windows/spike/**"
      - ".github/workflows/windows-overlay.yml"

jobs:
  build-overlay-spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build WPF overlay spike
        run: dotnet build windows/spike/OverlaySpike.csproj -c Release -p:Platform=x64 --no-restore
