name: Windows overlay spike

on:
  push:
    paths:
      - "windows/spike/**"
      - ".github/workflows/windows-overlay.yml"
  pull_request:
    paths:
      - "windows/spike/**"
      - ".github/workflows/windows-overlay.yml"

# Nothing here writes to the repository, so the token needs to read and nothing
# more. A build step that turns malicious has no write to exfiltrate through.
permissions:
  contents: read

# The spike compiles on every push to windows/spike. An older run's result
# describes an older commit, so cancel it rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-overlay-spike:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, matching the macOS workflow. Nothing in the spike
          # reads the log today; a depth-1 clone here would only surprise the
          # next change that does (a version stamp, a changelog entry).
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: windows/spike/OverlaySpike.csproj

      - name: Build WPF overlay spike
        run: dotnet build windows/spike/OverlaySpike.csproj -c Release -p:Platform=x64
