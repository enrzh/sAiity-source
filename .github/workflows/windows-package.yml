name: Windows overlay package

on:
  workflow_dispatch:
  push:
    paths:
      - "windows/spike/**"
      - "windows/package/**"
      - ".github/workflows/windows-package.yml"

# Publishing a release asset needs no repository write: upload-artifact posts to
# the Actions artifact service, not to a git ref. So the token stays read-only.
permissions:
  contents: read

# Dispatch runs are deliberate and pushes are not: cancelling on a push would
# kill a packaging run an operator just started, so in-progress runs are kept
# and a newer push simply starts its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  package-overlay:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, matching the other workflows: the version that goes
          # into the package is stamped from it.
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: windows/spike/OverlaySpike.csproj

      - name: Publish self-contained executable
        run: >-
          dotnet publish windows/spike/OverlaySpike.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -o staging/app

      - name: Assemble install package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/package | Out-Null
          Copy-Item staging/app/sAiity.WindowsOverlayPrototype.exe staging/package/
          Copy-Item windows/package/Install.ps1 staging/package/
          Copy-Item windows/package/Uninstall.ps1 staging/package/
          Copy-Item windows/package/README.txt staging/package/
          Compress-Archive -Path staging/package/* -DestinationPath staging/sAiity-windows-overlay-prototype-win-x64.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: saiity-windows-overlay-prototype-win-x64
          path: staging/sAiity-windows-overlay-prototype-win-x64.zip
          if-no-files-found: error
          retention-days: 30
